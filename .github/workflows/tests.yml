name: Test dispatch and app syntax
on:
  push:
    branches: [feat/optimized-peak-dispatch-sketch]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Compile all source files
        run: python -m compileall -q app.py pcm tests scripts
      - name: Import constructed Shiny app
        run: python -c "from app import app; print('Shiny app constructed successfully')"
      - name: Smoke-test Shiny HTTP startup
        run: python -m scripts.smoke_web_app
      - name: Run tests
        run: python -m pytest -q
      - name: Benchmark default synthetic profile
        run: python -m scripts.benchmark_peak
      - name: Benchmark end-to-end month including cycle audit
        run: python -m scripts.benchmark_full
